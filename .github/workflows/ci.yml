name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the production compose profile
        env:
          BIND_ADDRESS: 127.0.0.1
          SITE_ADDRESS: http://localhost
          DB_PASSWORD: ci-only
          DB_ROOT_PASSWORD: ci-only
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker run --rm -e SITE_ADDRESS=http://localhost -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          bash -n scripts/backup-db.sh scripts/restore-db.sh database/init-prod/02-production.sh

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check key pages respond
        run: |
          set -e
          test "$(curl -fsS http://localhost:8080/health)" = "ok"
          for path in / /login /register /community; do
            curl -fsS -o /dev/null "http://localhost:8080$path"
          done
          # Source code, configuration and the database dump must never be served
          for path in /database/gradedunit.sql /src/lib/scoring.ts /package.json /.env; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")" = "404"
          done

      - name: Create an admin with the bundled script
        run: |
          docker compose exec -T -e ADMIN_PASSWORD=CiAdmin2026x app \
            node scripts/create-admin.mts ci-admin@example.com "CI Admin"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  e2e:
    name: End-to-end & accessibility tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
