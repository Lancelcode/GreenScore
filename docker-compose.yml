# GreenScore — local stack: `docker compose up`, then open http://localhost:8080
#
# Works with no configuration: every setting has a demo default. Copy
# .env.example to .env to change ports or passwords.
name: greenscore

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-gradedunit}
      MARIADB_USER: ${DB_USER:-greenscore}
      MARIADB_PASSWORD: ${DB_PASSWORD:-greenscore-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-greenscore-root-local}
    volumes:
      - db-data:/var/lib/mysql
      # Schema + demo data, loaded automatically the first time the volume is created
      - ./database/gradedunit.sql:/docker-entrypoint-initdb.d/01-gradedunit.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: greenscore-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gradedunit}
      DB_USER: ${DB_USER:-greenscore}
      DB_PASSWORD: ${DB_PASSWORD:-greenscore-local}
      APP_DEBUG: ${APP_DEBUG:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
