# Production profile for the home server (Debian + Tailscale).
#
# Layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env (see
# .env.production.example) so a plain `docker compose up -d` uses both.
#
# Differences from the local stack:
#   - Caddy is the only service with published ports, bound to the server's
#     Tailscale address so nothing is reachable from the LAN or internet.
#   - Passwords are required (no demo defaults).
#   - Demo accounts are removed on first start unless KEEP_DEMO_DATA=1.
#   - Log rotation, no-new-privileges and healthchecks on every service.
# Requires Docker Compose v2.24 or newer (for `!reset`).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    environment:
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
      KEEP_DEMO_DATA: ${KEEP_DEMO_DATA:-0}
    volumes:
      - ./database/init-prod/02-production.sh:/docker-entrypoint-initdb.d/02-production.sh:ro
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  app:
    ports: !reset []
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TRUST_PROXY: "1"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "${BIND_ADDRESS:?Set BIND_ADDRESS to the server's Tailscale IP}:80:80"
      - "${BIND_ADDRESS}:443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Lets Caddy fetch HTTPS certificates for *.ts.net names from tailscaled.
      - ${TAILSCALE_SOCKET_DIR:-/var/run/tailscale}:/var/run/tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  caddy-data:
  caddy-config:
